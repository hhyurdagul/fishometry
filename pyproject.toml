[project]
name = "fishometry"
version = "0.1.0"
description = "Single-image fish length estimation research pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "altair>=6.0.0",
    "google-genai>=1.73.1",
    "jupyter>=1.1.1",
    "marimo>=0.23.1",
    "pandas>=2.3.3",
    "polars>=1.39.3",
    "joblib>=1.4",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "pydantic>=2.12.5",
    "scikit-learn>=1.7.2",
    "segment-anything",
    "streamlit>=1.57.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "typer>=0.24.1",
    "ultralytics>=8.4.35",
    "xgboost>=3.2.0",
]

[tool.uv.sources]
segment-anything = { git = "https://github.com/facebookresearch/segment-anything.git" }

[dependency-groups]
dev = [
    "ruff==0.15.8",
    "ty==0.0.55",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ty.src]
include = ["src"]

